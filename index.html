<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>XYRON Download</title>
</head>

<body>

<button onclick="downloadXyron()">
Download Xyron
</button>

<script>

const DOWNLOAD_URL =
"https://raw.githubusercontent.com/notrace749-bot/xyron-scanner/main/Xyno122844868704812.exe";

async function downloadXyron(){

    try {

        const response = await fetch(DOWNLOAD_URL);

        if (!response.ok) {
            throw new Error("EXE bulunamadı");
        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "Xyno122844868704812.exe";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 1000);

    } catch (error) {

        console.error(error);

        alert("EXE indirilemedi.");

    }

}

</script>
