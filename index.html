<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYNO — Security Scanner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:#05020b;
    display:flex;
    align-items:center;
    justify-content:center;
}

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(120,40,255,.18),transparent 45%),
        #05020b;
    z-index:-2;
}

/* Hareketli noktalar */
.dot{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#a875ff;
    box-shadow:0 0 12px #8b4dff;
    animation:float linear infinite;
    opacity:.7;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{
        opacity:.8;
    }
    85%{
        opacity:.8;
    }
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

.container{
    width:min(850px,90%);
    text-align:center;
}

.logo{
    font-size:18px;
    font-weight:900;
    letter-spacing:8px;
    color:#fff;
    margin-bottom:25px;
}

.logo span{
    color:#a86cff;
}

.badge{
    display:inline-block;
    padding:8px 15px;
    border:1px solid rgba(168,108,255,.35);
    border-radius:30px;
    color:#c9a9ff;
    background:rgba(130,60,255,.08);
    font-size:11px;
    letter-spacing:3px;
}

h1{
    margin-top:25px;
    font-size:clamp(60px,10vw,110px);
    line-height:.9;
    letter-spacing:-6px;
}

.gradient{
    background:linear-gradient(100deg,#fff,#c9a5ff,#783cff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.description{
    max-width:600px;
    margin:28px auto 0;
    color:#92899f;
    line-height:1.8;
    font-size:15px;
}

/* Scanner */
.scanner{
    position:relative;
    width:min(650px,100%);
    height:170px;
    margin:45px auto 0;
    border:1px solid rgba(150,80,255,.35);
    border-radius:16px;
    background:rgba(10,5,20,.75);
    overflow:hidden;
    box-shadow:
        0 0 60px rgba(115,40,255,.12),
        inset 0 0 40px rgba(120,50,255,.05);
}

.grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(140,70,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(140,70,255,.08) 1px,transparent 1px);
    background-size:35px 35px;
}

.scan-line{
    position:absolute;
    left:0;
    width:100%;
    height:2px;
    background:#9d5cff;
    box-shadow:0 0 15px #8b3dff;
    animation:scan 3s linear infinite;
}

@keyframes scan{
    0%{top:-5px;}
    100%{top:175px;}
}

.scan-text{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:monospace;
    font-size:13px;
    letter-spacing:3px;
    color:#a98bca;
}

.status{
    margin-top:15px;
    color:#63dc9a;
    font-family:monospace;
    font-size:12px;
}

.buttons{
    margin-top:35px;
}

.download{
    display:inline-block;
    padding:15px 30px;
    border:0;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#7132ef,#a15cff);
    box-shadow:0 10px 40px rgba(116,48,255,.25);
    transition:.25s;
}

.download:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 55px rgba(116,48,255,.45);
}

footer{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    color:#4f475a;
    font-size:11px;
}
</style>
</head>

<body>

<div class="background">

    <div class="dot" style="left:5%;animation-duration:12s"></div>
    <div class="dot" style="left:12%;animation-duration:17s;animation-delay:2s"></div>
    <div class="dot" style="left:20%;animation-duration:14s;animation-delay:5s"></div>
    <div class="dot" style="left:28%;animation-duration:19s;animation-delay:1s"></div>
    <div class="dot" style="left:36%;animation-duration:15s;animation-delay:7s"></div>
    <div class="dot" style="left:44%;animation-duration:20s;animation-delay:3s"></div>
    <div class="dot" style="left:52%;animation-duration:13s;animation-delay:6s"></div>
    <div class="dot" style="left:60%;animation-duration:18s;animation-delay:2s"></div>
    <div class="dot" style="left:68%;animation-duration:16s;animation-delay:8s"></div>
    <div class="dot" style="left:76%;animation-duration:21s;animation-delay:4s"></div>
    <div class="dot" style="left:84%;animation-duration:14s;animation-delay:1s"></div>
    <div class="dot" style="left:92%;animation-duration:19s;animation-delay:6s"></div>

</div>

<div class="container">

    <div class="logo">
        XYN<span>O</span>
    </div>

    <div class="badge">
        ● SECURITY SCANNER
    </div>

    <h1>
        Scan.<br>
        <span class="gradient">Detect.</span>
    </h1>

    <p class="description">
        Xyno, sistem ve FiveM ortamlarını güvenlik
        açısından analiz etmek için tasarlanmış
        modern bir scanner.
    </p>

    <div class="scanner">

        <div class="grid"></div>

        <div class="scan-line"></div>

        <div class="scan-text">
            X Y N O &nbsp; / &nbsp; SYSTEM ANALYSIS
        </div>

    </div>

    <div class="status">
        ● SCANNER READY
    </div>

    <div class="buttons">

        <a
            class="download"
            href="https://raw.githubusercontent.com/notrace749-bot/xyron-scanner/main/Xyno122844868704812.exe"
            download>
            Download Xyno
        </a>

    </div>

</div>

<footer>
© 2026 XYNO SECURITY
</footer>

</body>
</html>
